server {
    listen 80;
    listen [::]:80;
    server_name sljenterprises.com www.sljenterprises.com;

    root /var/www/sljenterprises.com/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
