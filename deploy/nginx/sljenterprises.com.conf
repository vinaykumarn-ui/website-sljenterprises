server {
    listen 80;
    listen [::]:80;
    server_name sljenterprises.com www.sljenterprises.com;

    root /var/www/sljenterprises.com/html;
    index index.html;

    # HTML: always revalidate so visitors see a new deploy straight away
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include snippets/slje-security-headers.conf;
    }

    error_page 404 /404.html;

    # CSS/JS links carry ?v=<commit> from the deploy workflow, so they can be cached long
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        include snippets/slje-security-headers.conf;
    }

    location ~* \.(svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        include snippets/slje-security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
